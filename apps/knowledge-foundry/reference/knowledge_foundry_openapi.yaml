openapi: 3.1.0
info:
  title: MAWorld Knowledge Foundry API
  version: 1.0.0
  summary: Incremental evidence-to-implementation workspace API
  description: |
    Build-ready API contract for immutable raw intake, provenance, atomic claims,
    contradiction review, explicit canonicalization and implementation mapping.
    Text extracted from artifacts is always treated as data, never as executable instruction.
servers:
  - url: http://localhost:8080
    description: Local MVP
security:
  - bearerAuth: []
tags:
  - name: Intake
  - name: Artifacts
  - name: Claims
  - name: Contradictions
  - name: Canonicalization
  - name: Implementation
  - name: Research
  - name: Search
  - name: Review
  - name: Operations

paths:
  /v1/intake/files:
    post:
      tags: [Intake]
      summary: Hash and store one immutable raw file
      operationId: intakeFile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_system_key]
              properties:
                file:
                  type: string
                  format: binary
                source_system_key:
                  type: string
                  examples: [manual-drop]
                source_native_id:
                  type: string
                original_uri_or_path:
                  type: string
                observed_at:
                  type: string
                  format: date-time
                declared_data_class:
                  $ref: '#/components/schemas/DataClass'
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Artifact accepted; immutable raw storage and extraction jobs created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File exceeds configured size or expansion limits
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/intake/folder-scans:
    post:
      tags: [Intake]
      summary: Start or resume a local-folder scan
      operationId: scanLocalFolder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connector_id, root_id]
              properties:
                connector_id:
                  type: string
                  format: uuid
                root_id:
                  type: string
                  format: uuid
                  description: Server-registered allowlisted root; clients cannot submit filesystem paths
                include_globs:
                  type: array
                  items: {type: string}
                exclude_globs:
                  type: array
                  items: {type: string}
                resume_cursor:
                  type: object
                  additionalProperties: true
                max_files:
                  type: integer
                  minimum: 1
                  maximum: 100000
      responses:
        '202':
          description: Resumable ingestion run created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRun'

  /v1/connectors/{connector_id}/sync:
    post:
      tags: [Intake]
      summary: Poll or resume one connector using its incremental cursor
      operationId: syncConnector
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [INCREMENTAL, BACKFILL, RETRY]
                  default: INCREMENTAL
                cursor_override:
                  type: object
                  additionalProperties: true
                dry_run:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Connector sync accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionRun'
        '429':
          description: Connector rate limit reached; retry information returned

  /v1/artifacts/{artifact_id}:
    get:
      tags: [Artifacts]
      summary: Retrieve immutable raw artifact metadata and recovery location
      operationId: getArtifact
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/versions/{version_id}:
    get:
      tags: [Artifacts]
      summary: Retrieve a source-specific artifact version and lineage
      operationId: getArtifactVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Artifact version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/versions/{version_id}/classify:
    post:
      tags: [Artifacts]
      summary: Classify data sensitivity before external-provider routing
      operationId: classifyVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRequest'
      responses:
        '200':
          description: Effective classification decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataClassification'

  /v1/versions/{version_id}/extract:
    post:
      tags: [Artifacts]
      summary: Queue sandboxed text and structure extraction
      operationId: extractVersion
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parser_profile:
                  type: string
                  examples: [docling-safe-v1]
                force_retry:
                  type: boolean
                  default: false
                routing_policy_ref:
                  type: string
                  description: Reference to a server-owned policy; never a client permission flag
                  maxLength: 128
      responses:
        '202':
          description: Extraction job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '423':
          description: Artifact is quarantined or blocked by policy

  /v1/versions/{version_id}/relations:
    post:
      tags: [Artifacts]
      summary: Confirm duplicate, version, derivative, citation or contradiction relation
      operationId: createArtifactRelation
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactRelationRequest'
      responses:
        '201':
          description: Immutable relation object created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectEnvelope'

  /v1/claims:
    get:
      tags: [Claims]
      summary: List atomic claims using status, source, scope and time filters
      operationId: listClaims
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: status
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/ClaimStatus'}
          style: form
          explode: false
        - name: source_version_id
          in: query
          schema: {type: string, format: uuid}
        - name: subject
          in: query
          schema: {type: string}
        - name: include_superseded
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated atomic claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPage'

  /v1/claims/{claim_id}/review:
    post:
      tags: [Claims, Review]
      summary: Accept, reject, dispute, stale or request evidence for a claim
      operationId: reviewClaim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimReviewRequest'
      responses:
        '200':
          description: New claim review event and effective status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'

  /v1/contradictions:
    get:
      tags: [Contradictions]
      summary: List unresolved or historical contradictions
      operationId: listContradictions
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: state
          in: query
          schema: {type: string}
        - name: severity
          in: query
          schema: {$ref: '#/components/schemas/RiskTier'}
        - name: include_resolved
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Contradiction records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ContradictionRecord'}
                  next_cursor: {type: [string, 'null']}

  /v1/contradictions/{contradiction_id}/resolve:
    post:
      tags: [Contradictions, Review]
      summary: Resolve a conflict without silently merging affected objects
      operationId: resolveContradiction
      parameters:
        - $ref: '#/components/parameters/ContradictionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContinuityCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContradictionResolutionRequest'
      responses:
        '200':
          description: Resolution event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContradictionRecord'
        '403':
          $ref: '#/components/responses/PolicyDenied'

  /v1/open-questions:
    post:
      tags: [Contradictions]
      summary: Create a governed open question or required experiment
      operationId: createOpenQuestion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenQuestionRequest'
      responses:
        '201':
          description: Open question created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenQuestion'

  /v1/canonical-decisions/preview:
    post:
      tags: [Canonicalization]
      summary: Evaluate policy, conflicts and impact without mutation
      operationId: previewCanonicalDecision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContinuityCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalDecisionRequest'
      responses:
        '200':
          description: Policy preview and required approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalDecisionPreview'

  /v1/canonical-decisions:
    post:
      tags: [Canonicalization]
      summary: Create a signed immutable canonical decision event
      operationId: createCanonicalDecision
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContinuityCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalDecisionRequest'
      responses:
        '201':
          description: Signed immutable decision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalDecision'
        '403':
          $ref: '#/components/responses/PolicyDenied'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/canonical-decisions/{decision_id}/supersede:
    post:
      tags: [Canonicalization]
      summary: Append a signed supersession without overwriting history
      operationId: supersedeCanonicalDecision
      parameters:
        - $ref: '#/components/parameters/DecisionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContinuityCapability'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersessionRequest'
      responses:
        '201':
          description: Supersession record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupersessionRecord'
        '403':
          $ref: '#/components/responses/PolicyDenied'

  /v1/implementation-links:
    post:
      tags: [Implementation]
      summary: Link a decision or claim to ADR, schema, code, ticket, test, deployment or runtime evidence
      operationId: createImplementationLink
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementationLinkRequest'
      responses:
        '201':
          description: Implementation link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementationLink'

  /v1/coverage:
    get:
      tags: [Implementation]
      summary: Show decision-to-implementation and implementation-to-evidence gaps
      operationId: getImplementationCoverage
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: scope
          in: query
          schema:
            type: string
            enum: [ALL, DECISIONS, MODULES, SCHEMAS, TESTS, DEPLOYMENTS]
            default: ALL
      responses:
        '200':
          description: Coverage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageReport'

  /v1/research-runs:
    post:
      tags: [Research]
      summary: Register a reproducible Deep Research run
      operationId: createResearchRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRunRequest'
      responses:
        '201':
          description: Research run registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'

  /v1/research-runs/{research_run_id}/result:
    post:
      tags: [Research]
      summary: Attach raw result and source ledger, then queue source audit
      operationId: attachResearchResult
      parameters:
        - $ref: '#/components/parameters/ResearchRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_result_artifact_id, source_ledger]
              properties:
                raw_result_artifact_id:
                  type: string
                  format: uuid
                source_ledger:
                  type: array
                  items: {$ref: '#/components/schemas/SourceLedgerEntry'}
                reported_task_id:
                  type: string
                completeness:
                  type: number
                  minimum: 0
                  maximum: 1
      responses:
        '202':
          description: Result accepted for source audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
        '409':
          description: Reported task does not match registered run

  /v1/search:
    get:
      tags: [Search]
      summary: Hybrid exact, metadata, full-text, semantic and graph retrieval
      operationId: searchKnowledge
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1}
        - name: mode
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [EXACT, METADATA, FULL_TEXT, SEMANTIC, GRAPH]
            default: [FULL_TEXT, SEMANTIC]
          style: form
          explode: false
        - name: current_canonical_only
          in: query
          schema: {type: boolean, default: false}
        - name: include_superseded
          in: query
          schema: {type: boolean, default: false}
        - name: trust_classes
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/TrustClass'}
          style: form
          explode: false
        - name: data_classes
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/DataClass'}
          style: form
          explode: false
        - name: as_of
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ranked results with authority and provenance facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'

  /v1/snapshots/{snapshot_id}/delta:
    get:
      tags: [Search]
      summary: Show canonical, evidence and implementation changes since a snapshot
      operationId: getSnapshotDelta
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - name: compare_to
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Snapshot delta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDelta'

  /v1/review/inbox:
    get:
      tags: [Review]
      summary: Retrieve prioritized operator review tasks
      operationId: getReviewInbox
      parameters:
        - $ref: '#/components/parameters/ProjectKey'
        - name: queue
          in: query
          schema:
            type: string
            enum: [UNCLASSIFIED, DUPLICATES, CLAIMS, CONTRADICTIONS, CANON, OPEN_QUESTIONS, STALE, SENSITIVE]
        - name: status
          in: query
          schema: {type: string, default: OPEN}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Prioritized review tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ReviewTask'}
                  next_cursor: {type: [string, 'null']}

  /v1/jobs/{job_id}/retry:
    post:
      tags: [Operations]
      summary: Retry a failed idempotent job from its persisted checkpoint
      operationId: retryJob
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_terminal_failure:
                  type: boolean
                  default: false
                available_at:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /v1/indexes/semantic/rebuild:
    post:
      tags: [Operations]
      summary: Rebuild the non-authoritative semantic index from derived search documents
      operationId: rebuildSemanticIndex
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProjectKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                embedding_model:
                  type: string
                scope:
                  type: string
                  enum: [ALL, CURRENT_ONLY, CANONICAL_ONLY]
                  default: ALL
                delete_existing_generation:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Rebuild job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
      description: Stable key for replay-safe writes.
    ContinuityCapability:
      name: X-Continuity-Capability
      in: header
      required: true
      schema: {type: string}
      description: Capability token or signed policy decision issued by ContinuityOS.
    ProjectKey:
      name: X-Project-Key
      in: header
      required: true
      schema: {type: string}
      example: maworld
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionId:
      name: version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContradictionId:
      name: contradiction_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DecisionId:
      name: decision_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ResearchRunId:
      name: research_run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}

  responses:
    NotFound:
      description: Resource not found or not visible under the current access policy
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Idempotency, version, canonical or unresolved-conflict violation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Input failed schema or policy validation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PolicyDenied:
      description: ContinuityOS denied the requested capability or approval tier
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    DataClass:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED, SECRET, QUARANTINED]
    ArtifactState:
      type: string
      enum: [RAW, PARSED, INDEXED, CLAIMS_EXTRACTED, REVIEW_REQUIRED, ACCEPTED_AS_EVIDENCE, CANDIDATE_CANON, CANONICAL, SUPERSEDED, ARCHIVED, QUARANTINED]
    ClaimStatus:
      type: string
      enum: [PROPOSED, SUPPORTED, VERIFIED, DISPUTED, CONTRADICTED, STALE, SUPERSEDED, UNVERIFIABLE, REJECTED]
    RiskTier:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    TrustClass:
      type: string
      enum: [PRIMARY_OFFICIAL, PRIMARY_CODE, PRIMARY_RUNTIME_EVIDENCE, USER_AUTHORED, INDEPENDENT_RESEARCH, VENDOR_CLAIM, SECONDARY_SOURCE, MODEL_INFERENCE, UNVERIFIED_IMPORT, MALICIOUS_OR_QUARANTINED]
    ReviewStatus:
      type: string
      enum: [OPEN, CLAIMED, BLOCKED, APPROVED, REJECTED, CANCELLED, EXPIRED]

    Actor:
      type: object
      required: [actor_type, actor_id]
      properties:
        actor_type:
          type: string
          enum: [HUMAN, SERVICE, MODEL, CONNECTOR, POLICY]
        actor_id: {type: string}
        display_name: {type: string}

    SourceReference:
      type: object
      required: [source_system_id, source_native_id]
      properties:
        source_system_id: {type: string, format: uuid}
        source_native_id: {type: string}
        source_revision_key: {type: string}
        uri_or_path: {type: string}

    ObjectEnvelope:
      type: object
      required: [object_id, schema_version, source_references, content_hash, created_at, created_by, project_scope, data_class, status, provenance, policy_context]
      properties:
        object_id: {type: string, format: uuid}
        schema_version: {type: string}
        source_references:
          type: array
          items: {$ref: '#/components/schemas/SourceReference'}
        content_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created_at: {type: string, format: date-time}
        created_by: {$ref: '#/components/schemas/Actor'}
        project_scope: {type: string, format: uuid}
        data_class: {$ref: '#/components/schemas/DataClass'}
        status: {type: string}
        provenance:
          type: object
          additionalProperties: true
        policy_context:
          type: object
          additionalProperties: true

    Artifact:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [artifact_id, byte_size, media_type, raw_storage_uri]
          properties:
            artifact_id: {type: string, format: uuid}
            byte_size: {type: integer, minimum: 0}
            media_type: {type: string}
            detected_file_type: {type: string}
            original_filename: {type: string}
            raw_storage_uri: {type: string}
            storage_version_id: {type: string}
            object_lock_mode: {type: string}
            retain_until: {type: [string, 'null'], format: date-time}
            malware_scan_status: {type: string}
            secret_scan_status: {type: string}
            recoverability_verified_at: {type: [string, 'null'], format: date-time}

    ArtifactVersion:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
