        gaps:
          type: array
          items:
            type: object
            required: [gap_type, object_ids, severity]
            properties:
              gap_type: {type: string}
              object_ids:
                type: array
                items: {type: string, format: uuid}
              severity: {$ref: '#/components/schemas/RiskTier'}
              recommended_action: {type: string}

