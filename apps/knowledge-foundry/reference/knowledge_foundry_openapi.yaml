      type: object
      required: [generated_at, metrics, gaps]
      properties:
        generated_at: {type: string, format: date-time}
        metrics:
          type: object
          properties:
            accepted_decisions: {type: integer}
            decisions_implemented: {type: integer}
            decisions_verified: {type: integer}
