          required: [version_id, artifact_id, source_system_id, source_native_id, source_revision_key, observed_at, state]
          properties:
            version_id: {type: string, format: uuid}
            artifact_id: {type: string, format: uuid}
            logical_document_id: {type: [string, 'null'], format: uuid}
            parent_version_id: {type: [string, 'null'], format: uuid}
            duplicate_cluster_id: {type: [string, 'null'], format: uuid}
            source_system_id: {type: string, format: uuid}
            source_native_id: {type: string}
            source_revision_key: {type: string}
            original_uri_or_path: {type: string}
            observed_at: {type: string, format: date-time}
            source_created_at: {type: [string, 'null'], format: date-time}
            source_modified_at: {type: [string, 'null'], format: date-time}
            source_deleted_at: {type: [string, 'null'], format: date-time}
            is_partial: {type: boolean}
            is_tombstone: {type: boolean}
            state: {$ref: '#/components/schemas/ArtifactState'}
            lineage:
              type: array
              items:
                type: object
                properties:
                  relation: {type: string}
                  target_version_id: {type: string, format: uuid}
                  confidence: {type: number, minimum: 0, maximum: 1}

    IngestionRun:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [ingestion_run_id, source_system_id, trigger_kind, idempotency_key, started_at, run_status]
          properties:
            ingestion_run_id: {type: string, format: uuid}
            source_system_id: {type: string, format: uuid}
            trigger_kind: {type: string, enum: [MANUAL, POLL, PUSH, BACKFILL, RETRY]}
            idempotency_key: {type: string}
            cursor_before: {type: object, additionalProperties: true}
            cursor_after: {type: object, additionalProperties: true}
            started_at: {type: string, format: date-time}
            ended_at: {type: [string, 'null'], format: date-time}
            run_status: {type: string}
            discovered_count: {type: integer}
            ingested_count: {type: integer}
            skipped_count: {type: integer}
            failed_count: {type: integer}

    IntakeResponse:
      type: object
      required: [artifact, version, ingestion_run, jobs]
      properties:
        artifact: {$ref: '#/components/schemas/Artifact'}
        version: {$ref: '#/components/schemas/ArtifactVersion'}
        ingestion_run: {$ref: '#/components/schemas/IngestionRun'}
        deduplication:
          type: object
          properties:
            exact_duplicate: {type: boolean}
            existing_artifact_id: {type: [string, 'null'], format: uuid}
            candidate_cluster_ids:
              type: array
              items: {type: string, format: uuid}
        jobs:
          type: array
          items: {$ref: '#/components/schemas/Job'}

    ClassificationRequest:
      type: object
      required: [classification, reasons, classifier_kind]
      properties:
        classification: {$ref: '#/components/schemas/DataClass'}
        reasons:
          type: array
          items: {type: string}
        classifier_kind:
          type: string
          enum: [HUMAN, RULE, MODEL, SECRET_SCANNER]
        secret_findings:
          type: array
          items:
            type: object
            additionalProperties: true
        provider_routes_requested:
          type: array
          items: {type: string}

    DataClassification:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [classification_id, target_object_id, classification, reasons, classifier_kind]
          properties:
            classification_id: {type: string, format: uuid}
            target_object_id: {type: string, format: uuid}
            classification: {$ref: '#/components/schemas/DataClass'}
            reasons:
              type: array
              items: {type: string}
            classifier_kind: {type: string}
            reviewed_at: {type: [string, 'null'], format: date-time}

    ArtifactRelationRequest:
      type: object
      required: [target_version_id, relation, confidence, rationale]
      properties:
        target_version_id: {type: string, format: uuid}
        relation:
          type: string
          enum: [EXACT_DUPLICATE, NEAR_DUPLICATE, VERSION_OF, DERIVATIVE_OF, CITES, CONTRADICTS, SUPERSEDES, EXTRACTED_FROM, ATTACHMENT_OF, MERGED_FROM, UNRELATED]
        confidence: {type: number, minimum: 0, maximum: 1}
        rationale:
          type: object
          additionalProperties: true
        human_confirmation_ref:
          type: [string, 'null']
          default: null
          description: Reference to an externally verified, action-bound approval; claimant booleans are not authority.

    Claim:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [claim_id, normalized_assertion, exact_source_excerpt, source_location, subject, predicate, object_value, source_version_id, extraction_confidence, claim_status]
          properties:
            claim_id: {type: string, format: uuid}
            normalized_assertion: {type: string}
            exact_source_excerpt: {type: string}
            source_location: {type: object, additionalProperties: true}
            scope: {type: object, additionalProperties: true}
            subject: {type: string}
            predicate: {type: string}
            object_value: {}
            valid_from: {type: [string, 'null'], format: date-time}
            valid_until: {type: [string, 'null'], format: date-time}
            source_version_id: {type: string, format: uuid}
            author: {$ref: '#/components/schemas/Actor'}
            extraction_confidence: {type: number, minimum: 0, maximum: 1}
            claim_status: {$ref: '#/components/schemas/ClaimStatus'}
            evidence_links:
              type: array
              items: {$ref: '#/components/schemas/EvidenceLink'}

    EvidenceLink:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [evidence_link_id, claim_id, support, independence]
          properties:
            evidence_link_id: {type: string, format: uuid}
            claim_id: {type: string, format: uuid}
            evidence_artifact_id: {type: [string, 'null'], format: uuid}
            evidence_version_id: {type: [string, 'null'], format: uuid}
            evidence_object_id: {type: [string, 'null'], format: uuid}
            support:
              type: string
              enum: [SUPPORTS, PARTIALLY_SUPPORTS, REFUTES, CONTEXTUALIZES, IMPLEMENTS, VERIFIES, CITES]
            independence:
              type: string
              enum: [INDEPENDENT, PARTIALLY_DEPENDENT, SAME_ORIGIN, DERIVED_FROM_CLAIM, UNKNOWN]
            freshness_score: {type: [number, 'null'], minimum: 0, maximum: 1}
            quality_score: {type: [number, 'null'], minimum: 0, maximum: 1}
            exact_evidence_excerpt: {type: [string, 'null']}
            limitations:
              type: array
              items: {type: string}

    ClaimPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Claim'}
        next_cursor: {type: [string, 'null']}

    ClaimReviewRequest:
      type: object
      required: [action, rationale]
      properties:
        action:
          type: string
          enum: [SUPPORT, VERIFY, DISPUTE, CONTRADICT, MARK_STALE, REJECT, REQUEST_VERIFICATION]
        rationale: {type: string}
        evidence_link_ids:
          type: array
          items: {type: string, format: uuid}
        create_open_question:
          type: boolean
          default: false

    ContradictionRecord:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [contradiction_id, contradiction_kind, title, description, severity, resolution_state, affected_claim_ids]
          properties:
            contradiction_id: {type: string, format: uuid}
            contradiction_kind: {type: string}
            title: {type: string}
            description: {type: string}
            severity: {$ref: '#/components/schemas/RiskTier'}
            resolution_state: {type: string}
            affected_claim_ids:
              type: array
              items: {type: string, format: uuid}
            affected_decision_ids:
              type: array
              items: {type: string, format: uuid}
            proposed_tests:
              type: array
              items: {type: object, additionalProperties: true}
            final_resolution: {type: [object, 'null'], additionalProperties: true}

    ContradictionResolutionRequest:
      type: object
      required: [resolution, rationale, affected_object_actions]
      properties:
        resolution:
          type: string
          enum: [RESOLVED, ACCEPTED_DIVERGENCE, TEST_REQUIRED, SUPERSEDED, REJECTED]
        rationale: {type: string}
        winning_claim_ids:
          type: array
          items: {type: string, format: uuid}
        affected_object_actions:
          type: array
          items:
            type: object
            required: [object_id, action]
            properties:
              object_id: {type: string, format: uuid}
              action: {type: string, enum: [KEEP, REJECT, SUPERSEDE, MARK_STALE, OPEN_QUESTION]}
        test_result_object_ids:
          type: array
          items: {type: string, format: uuid}

    OpenQuestionRequest:
      type: object
      required: [question, rationale, priority, resolution_criteria]
      properties:
        question: {type: string}
        rationale: {type: string}
        priority: {$ref: '#/components/schemas/RiskTier'}
        affected_object_ids:
          type: array
          items: {type: string, format: uuid}
        owner: {$ref: '#/components/schemas/Actor'}
        due_at: {type: [string, 'null'], format: date-time}
        resolution_criteria:
          type: object
          additionalProperties: true
        required_experiment:
          type: [object, 'null']
          additionalProperties: true

    OpenQuestion:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - $ref: '#/components/schemas/OpenQuestionRequest'
        - type: object
          required: [open_question_id, status]
          properties:
            open_question_id: {type: string, format: uuid}
            status: {type: string}
            answer: {type: [object, 'null'], additionalProperties: true}

    CanonicalDecisionRequest:
      type: object
      required: [decision_key, decision_type, risk_tier, resolution, decision_statement, rationale, claim_ids, evidence_link_ids, assumptions, alternatives, rejected_alternatives, risks, confidence, acceptance_test, revisit_trigger]
      properties:
        decision_key: {type: string, pattern: '^[A-Z0-9_.-]+$'}
        expected_prior_version: {type: [integer, 'null'], minimum: 1}
        title: {type: string}
        decision_type:
          type: string
          enum: [TERMINOLOGY, INVARIANT, ARCHITECTURE, SCHEMA, API_CONTRACT, REPOSITORY_STRUCTURE, POLICY, BENCHMARK, IMPLEMENTATION_STATUS, PRODUCT_HYPOTHESIS]
        risk_tier: {$ref: '#/components/schemas/RiskTier'}
        resolution:
          type: string
          enum: [ACCEPTED, REJECTED, DEFERRED, EXPERIMENT_REQUIRED]
        decision_statement: {type: string}
        rationale: {type: string}
        claim_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
        evidence_link_ids:
          type: array
          items: {type: string, format: uuid}
        assumptions:
          type: array
          items: {type: string}
        alternatives:
          type: array
          items: {type: object, additionalProperties: true}
        rejected_alternatives:
          type: array
          items: {type: object, additionalProperties: true}
        risks:
          type: array
          items: {type: object, additionalProperties: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        acceptance_test:
          type: object
          additionalProperties: true
        revisit_trigger:
          type: object
          additionalProperties: true
        architecture_impacts:
          type: array
          items: {type: object, additionalProperties: true}

    CanonicalDecisionPreview:
      type: object
      required: [allowed, risk_tier, required_approvals, blocking_conflicts, decision_hash]
      properties:
        allowed: {type: boolean}
        risk_tier: {$ref: '#/components/schemas/RiskTier'}
        required_approvals:
          type: array
          items: {type: string}
        blocking_conflicts:
          type: array
          items: {type: string, format: uuid}
        policy_decision_id: {type: string}
        decision_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        warnings:
          type: array
          items: {type: string}

    CanonicalDecision:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - $ref: '#/components/schemas/CanonicalDecisionRequest'
        - type: object
          required: [canonical_decision_id, decision_version, approved_by, approved_at, policy_decision_id, signature_algorithm, signature, immutable_payload_hash]
          properties:
            canonical_decision_id: {type: string, format: uuid}
            decision_version: {type: integer, minimum: 1}
            approved_by: {$ref: '#/components/schemas/Actor'}
            approved_at: {type: string, format: date-time}
            policy_decision_id: {type: string}
            signature_algorithm: {type: string}
            signature: {type: string}
            immutable_payload_hash:
              type: string
              pattern: '^[0-9a-f]{64}$'

    SupersessionRequest:
      type: object
      required: [superseding_object_id, reason, effective_at]
      properties:
        superseding_object_id: {type: string, format: uuid}
        reason: {type: string}
        effective_at: {type: string, format: date-time}

    SupersessionRecord:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [supersession_record_id, superseded_object_id, superseding_object_id, reason, effective_at, approved_by, policy_decision_id, signature]
          properties:
            supersession_record_id: {type: string, format: uuid}
            superseded_object_id: {type: string, format: uuid}
            superseding_object_id: {type: string, format: uuid}
            reason: {type: string}
            effective_at: {type: string, format: date-time}
            approved_by: {$ref: '#/components/schemas/Actor'}
            policy_decision_id: {type: string}
            signature: {type: string}

    ImplementationLinkRequest:
      type: object
      required: [link_type]
      properties:
        canonical_decision_id: {type: [string, 'null'], format: uuid}
        claim_id: {type: [string, 'null'], format: uuid}
        architecture_impact_id: {type: [string, 'null'], format: uuid}
        link_type:
          type: string
          enum: [IMPLEMENTS, PARTIALLY_IMPLEMENTS, VERIFIES, DEPLOYS, OBSERVES, CONTRADICTS, DEPRECATES]
        repository: {type: string}
        repository_path: {type: string}
        git_commit_sha: {type: string}
        pull_request_ref: {type: object, additionalProperties: true}
        ticket_ref: {type: object, additionalProperties: true}
        test_ref: {type: object, additionalProperties: true}
        deployment_ref: {type: object, additionalProperties: true}
        runtime_evidence_ref: {type: object, additionalProperties: true}
        observed_at: {type: [string, 'null'], format: date-time}

    ImplementationLink:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - $ref: '#/components/schemas/ImplementationLinkRequest'
        - type: object
          required: [implementation_link_id, verification_status]
          properties:
            implementation_link_id: {type: string, format: uuid}
            verification_status: {$ref: '#/components/schemas/ClaimStatus'}

