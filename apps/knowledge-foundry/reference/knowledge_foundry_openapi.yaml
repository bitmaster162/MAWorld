      type: object
      required: [task_id, exact_prompt, context_manifest, source_priority, excluded_scope, model_provider, model_name]
      properties:
        task_id: {type: string}
        exact_prompt: {type: string}
        context_manifest:
          type: object
          required: [manifest_version, included_object_ids]
          properties:
            manifest_version: {type: string}
            included_object_ids:
              type: array
              items: {type: string, format: uuid}
            attached_version_ids:
              type: array
              items: {type: string, format: uuid}
            exclusions:
              type: array
              items: {type: object, additionalProperties: true}
            token_budget: {type: integer}
        source_priority:
          type: array
          items: {type: object, additionalProperties: true}
        excluded_scope:
          type: array
          items: {type: string}
        model_provider: {type: string}
        model_name: {type: string}
        model_configuration: {type: object, additionalProperties: true}
        blind_group_key: {type: [string, 'null']}

    ResearchRun:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - $ref: '#/components/schemas/ResearchRunRequest'
        - type: object
          required: [research_run_id, run_status, prompt_hash]
          properties:
            research_run_id: {type: string, format: uuid}
            run_status:
              type: string
              enum: [PLANNED, RUNNING, RESULT_RECEIVED, SOURCES_AUDITED, CLAIMS_EXTRACTED, DELTA_REVIEWED, MERGED_OR_REJECTED, ARCHIVED]
            prompt_hash:
              type: string
              pattern: '^[0-9a-f]{64}$'
            started_at: {type: [string, 'null'], format: date-time}
            ended_at: {type: [string, 'null'], format: date-time}
            raw_result_artifact_id: {type: [string, 'null'], format: uuid}
            completeness: {type: [number, 'null'], minimum: 0, maximum: 1}
            reviewer_decision: {type: [string, 'null']}

    SourceLedgerEntry:
      type: object
      required: [accessed_at, trust_class]
      properties:
        source_uri: {type: string}
        source_title: {type: string}
        publisher: {type: string}
        author: {$ref: '#/components/schemas/Actor'}
        published_at: {type: [string, 'null'], format: date-time}
        accessed_at: {type: string, format: date-time}
        content_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        archived_artifact_id: {type: [string, 'null'], format: uuid}
        trust_class: {$ref: '#/components/schemas/TrustClass'}
        citation_locator: {type: object, additionalProperties: true}

    SearchResult:
      type: object
      required: [object_id, object_type, score, authority_state, data_class, provenance_summary]
      properties:
        object_id: {type: string, format: uuid}
        object_type: {type: string}
        title: {type: string}
        snippet: {type: string}
        score: {type: number}
        score_components:
          type: object
          properties:
            exact: {type: number}
            full_text: {type: number}
            semantic: {type: number}
            graph: {type: number}
            trust: {type: number}
            freshness: {type: number}
        authority_state: {type: string}
        data_class: {$ref: '#/components/schemas/DataClass'}
        trust_classes:
          type: array
          items: {$ref: '#/components/schemas/TrustClass'}
        source_version_id: {type: [string, 'null'], format: uuid}
        provenance_summary: {type: object, additionalProperties: true}

    SearchPage:
      type: object
      required: [items, query_plan]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SearchResult'}
        next_cursor: {type: [string, 'null']}
        query_plan:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items: {type: string}

