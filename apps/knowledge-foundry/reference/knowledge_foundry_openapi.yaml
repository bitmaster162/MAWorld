      type: object
      required: [job_id, job_type, idempotency_key, job_status, priority, attempts, max_attempts, available_at]
      properties:
        job_id: {type: string, format: uuid}
        job_type: {type: string}
        idempotency_key: {type: string}
        job_status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED_RETRYABLE, FAILED_TERMINAL, CANCELLED]
        priority: {type: integer}
        attempts: {type: integer}
        max_attempts: {type: integer}
        available_at: {type: string, format: date-time}
        locked_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [object, 'null'], additionalProperties: true}

    Problem:
      type: object
