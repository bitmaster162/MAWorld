        base_snapshot_id: {type: string, format: uuid}
        target_snapshot_id: {type: string, format: uuid}
        changes:
          type: object
          properties:
            canonical_added:
              type: array
              items: {type: string, format: uuid}
            canonical_superseded:
              type: array
              items: {type: string, format: uuid}
            claims_status_changed:
              type: array
              items: {type: object, additionalProperties: true}
            contradictions_opened:
              type: array
              items: {type: string, format: uuid}
            contradictions_resolved:
              type: array
              items: {type: string, format: uuid}
            implementation_links_changed:
              type: array
              items: {type: object, additionalProperties: true}

    ReviewTask:
      allOf:
        - $ref: '#/components/schemas/ObjectEnvelope'
        - type: object
          required: [review_task_id, queue_name, action_type, target_object_id, priority, risk_tier, review_status, context_bundle, allowed_actions]
          properties:
            review_task_id: {type: string, format: uuid}
            queue_name: {type: string}
            action_type: {type: string}
            target_object_id: {type: string, format: uuid}
            priority: {type: integer, minimum: 0, maximum: 1000}
            risk_tier: {$ref: '#/components/schemas/RiskTier'}
            review_status: {$ref: '#/components/schemas/ReviewStatus'}
            assigned_to: {$ref: '#/components/schemas/Actor'}
            due_at: {type: [string, 'null'], format: date-time}
            context_bundle: {type: object, additionalProperties: true}
            allowed_actions:
              type: array
              items: {type: string}

