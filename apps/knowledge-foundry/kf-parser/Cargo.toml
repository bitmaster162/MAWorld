[package]
name = "kf-parser"
version = "0.1.0"
edition = "2021"
description = "Knowledge Foundry parser router + extraction (build-seq E+F): native MD/TXT/source, rich->sandbox"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }
anyhow = "1"

[[bin]]
name = "kfparse"
path = "src/main.rs"
